const cv = document.getElementById('c'), g = cv.getContext('2d');

const T = {

  push: 480, cards: [490, 520, 550, 580], focus: [612, 642, 672, 702],
  s4: 750, wipe: 721, warn: 754, rule: 760, prompt: 820

/* ---------- spring physics (mass .35, stiffness 180, damping 12) ---------- */
const M = 0.35, K = 180, D = 12;
const SA = D/(2*M), SW = Math.sqrt(K/M - SA*SA);

const lerp = (a,b,t) => a + (b-a)*t;
const seg = (f,a,b) => clamp((f-a)/(b-a));
const eio = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const eo = t => 1 - Math.pow(1-t,3);
const font = (px, wt=700) => `${wt} ${px}px Mont`;

/* ---------- camera (engine grammar: only the camera moves the stage) ---------- */
// scene worlds sit side by side: S1 at x 0, S2 at x 1080, S3 at x 2160
const camX = f => 1080*spring(f - T.s2) + 1080*spring(f - T.push);

/* ---------- stage: cream matte, radial lift, hairline grid on a 48 px module ---------- */
function stage(f){
  g.fillStyle = C.bg; g.fillRect(0,0,W,H);
  const lr = g.createRadialGradient(540, 760, 40, 540, 760, 1100);
  lr.addColorStop(0, C.lift); lr.addColorStop(1, 'rgba(247,244,235,0)'); g.fillStyle = lr; g.fillRect(0,0,W,H);
  grid(-camX(f) % 192, 0, 1);
  const vg = g.createRadialGradient(540, 960, 700, 540, 960, 1500);
  vg.addColorStop(0,'rgba(17,17,17,0)'); vg.addColorStop(1,'rgba(17,17,17,0.06)'); g.fillStyle = vg; g.fillRect(0,0,W,H);
}
function grid(ox, oy, alpha, color='17,17,17', boost=1){
  const step = 48, major = 4; g.save(); g.lineWidth = 1;

    g.strokeStyle = `rgba(${color},${(pass?0.075:0.035)*alpha*boost})`; g.beginPath();
    for (let i=-1; i<=W/step+1; i++){ if ((i%major===0) !== !!pass) continue; const x = Math.round(ox + i*step)+0.5; g.moveTo(x,0); g.lineTo(x,H); }
    for (let j=0; j<=H/step+1; j++){ if ((j%major===0) !== !!pass) continue; const y = Math.round(oy + j*step)+0.5; g.moveTo(0,y); g.lineTo(W,y); }

}
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function panel(x,y,w,h,{r=20, stroke=C.ink, lw=1, shadow=1, fill=C.card}={}){
  g.save(); g.shadowColor = `rgba(17,17,17,${0.10*shadow})`; g.shadowBlur = 34; g.shadowOffsetY = 10;
  g.fillStyle = fill; rr(x,y,w,h,r); g.fill(); g.restore();

/* ---------- vector geometry cache (built once) ---------- */

const mirror = p => p.map(([x,y])=>[-x,y]);
const TORSO = (() => { const L = [];
  L.push(join([[-46,-272],[-52,-200]], bez([-52,-200],[-95,-178],[-195,-168],[-245,-140]), bez([-245,-140],[-285,-128],[-302,-90],[-300,-40]), bez([-300,-40],[-300,20],[-306,110],[-300,172])));

  L.push(bez([-212,-80],[-185,20],[-70,25],[-14,-12]));
  for (let i=0;i<3;i++) L.push(bez([-14,52+i*42],[-70,62+i*42],[-150,72+i*45],[-178,98+i*48]));
  const P = new Path2D(); const add = pts => pts.forEach((p,i)=> i? P.lineTo(p[0],p[1]) : P.moveTo(p[0],p[1]));

const DASH = (() => { const P = new Path2D(); P.moveTo(0,60); P.lineTo(0,245); return P; })();
const HEART = (() => { const P = new Path2D(); for(let i=0;i<=120;i++){ const t=TAU*i/120;
  const x = 16*Math.pow(Math.sin(t),3), y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); i? P.lineTo(x,y):P.moveTo(x,y); } P.closePath(); return P; })();

const heartScale = f => { const ph = ((f%BEAT)+BEAT)%BEAT; return 1 + 0.10*kick(ph) + 0.05*kick(ph-7); };

/* ---------- torso: light-reveal (native move) then a living, beating heart ---------- */

    g.save(); clipDiag(front); drawBody(C.ink, 1); g.restore();

  g.lineWidth = 1; g.strokeStyle = 'rgba(207,117,43,0.28)'; g.beginPath();

/* ---------- text: balanced wrap + caption toast (engine caption component, restyled) ---------- */
function wrap(words, maxW){

  const width = a => a.reduce((s,o,i)=> s+o.w+(i?sp:0), 0);

function words(text, red=[]){ return text.split(' ').map(t => ({t, red: red.includes(t.replace(/[^\w%#']/g,''))})); }

    ln.forEach(o => { const st = anim ? anim(idx) : {a:1, dy:0, s:1}; idx++;
      if (st.a > 0){ g.save(); g.globalAlpha *= st.a; g.translate(x + o.w/2, y + st.dy); g.scale(st.s, st.s);
        if (o.red){ g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 20; } else g.fillStyle = C.ink;

/* ---------- social safe zone: all UI lives in x 40–910 (right 15 % clear), y 384–1440 (bottom 25 % clear) ---------- */
const US = 0.906, UTX = -14.4, UTY = -7.7;
const toS = (x, y) => [UTX + US*x, UTY + US*y];

/* ---------- Scene 1 + 2 ---------- */
const TEXT_LOG = [];   // filled during render for TEXTS()

  const s1x = -cx;
  if (s1x > -1100){
    ecg(f, s1x, eo(seg(f, 16, 32)));
    // readouts
    g.save(); g.globalAlpha = eo(seg(f, 30, 44)) * veil; g.font = font(22, 600); g.letterSpacing = '5px'; g.fillStyle = C.org; g.textBaseline = 'middle';
    g.restore();
  }
  // S1 caption rail: new caption enters bottom slot, old one translates up and fades
  if (f < T.s2 + 16){
    const out = 1 - seg(f, T.s2, T.s2 + 12);
    const c1fr = f - T.cap1, up1 = eio(seg(f, T.cap2, T.cap2 + 12));
    const a1 = clamp((c1fr+6)/6) * (1 - seg(f, T.cap2 + 10, T.cap2 + 26)) * out;
    const r1 = toast('Why does your body burn energy...', 1330, a1, {dy: (1-eo(clamp((c1fr+4)/10)))*24 - up1*118});
    if (r1 && a1 > 0.9) TEXT_LOG.push({id:'cap1', text:'Why does your body burn energy...', ...r1});
    const c2fr = f - T.cap2;
    if (c2fr >= 0){ const sp = spring(c2fr); const r2 = toast("...even if you're completely at rest?", 1330, clamp(c2fr/4)*out, {sc: lerp(0.6,1,sp), dy:(1-sp)*24});
      if (r2 && out > 0.9 && c2fr > 6) TEXT_LOG.push({id:'cap2', text:"...even if you're completely at rest?", ...r2}); }
  }
  // "That's your BMR." massive, centred, BMR in brand red
  const bf = f - T.bmr;
  if (bf >= 0 && f < T.s2 + 10){
    const sp = spring(bf), out = 1 - seg(f, T.s2+4, T.s2+12);
    g.save(); g.globalAlpha = clamp(bf/3)*out; g.translate(540 + s1x, 830); g.scale(lerp(1.6,1,sp), lerp(1.6,1,sp));
    g.textAlign='center'; g.textBaseline='middle'; g.font = font(96, 900); g.fillStyle = INK(f); g.fillText("That's your", 0, -112);
    g.font = font(270, 900); g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 40; g.fillText('BMR.', 0, 70);
    g.restore();
    if (out > 0.9 && bf > 6) TEXT_LOG.push({id:'bmr', text:"That's your BMR.", x0:160, y0:660, x1:920, y1:1000});
  }
  // ---------- Scene 2 world (x + 1080) ----------
  const s2x = 1080 - cx;
  if (f >= T.s2 && s2x > -1100){
    // header caption locks to top-centre (screen space until the push carries it away)
    const hf = f - T.s2, hs = spring(hf);
    g.save(); g.globalAlpha = clamp(hf/5); g.translate(-pushOut, (1-hs)*-40); g.font = font(46, 700);
    const L = wrap(words('BMR is your baseline survival cost.', ['BMR']), 900); drawWords(L, 540, 592, 58, null); g.restore();
    if (hf > 6 && f < T.push) TEXT_LOG.push({id:'cap3', text:'BMR is your baseline survival cost.', x0:90, y0:550, x1:990, y1:640});
    ring(f, 540 + s2x, 1148);
    // word-by-word under the wheel
    const wf = f - T.cap4;
    if (wf >= 0){ g.save(); g.translate(-pushOut, 0); g.font = font(44, 600);
      const L2 = wrap(words("It's up to 75% of your total daily burn.", ['75%']), 860);
      drawWords(L2, 540, 1396, 56, i => { const fr = wf - i*4; const sp = spring(fr); return {a: clamp(fr/3), dy: (1-sp)*26, s: lerp(0.7,1,sp)}; });
      g.restore(); if (wf > 40 && f < T.push) TEXT_LOG.push({id:'cap4', text:"It's up to 75% of your total daily burn.", x0:110, y0:1340, x1:970, y1:1420}); }
  }
}
function ring(f, x, y){
  const r = 148, appear = spring(f - T.s2 - 4);
  if (appear <= 0) return;
  const p = eio(seg(f, T.ringA, T.ringB)), val = 75*p, hit = f >= T.ringB;
  // radial expansion wave across the grid lines at the hit
  if (hit){ const wp = seg(f, T.ringB, T.ringB + 48); if (wp < 1){ const R = eo(wp)*1500, bw = 120;
    g.save(); g.beginPath(); g.arc(x, y, R + bw, 0, TAU); g.arc(x, y, Math.max(0, R - bw), 0, TAU, true); g.clip('evenodd');
    grid(-camX(f) % 192, 0, (1-wp), '207,117,43', 7); g.restore();
    g.save(); g.strokeStyle = C.red; g.globalAlpha = 0.35*(1-wp); g.lineWidth = 3; g.shadowColor = GLOW; g.shadowBlur = 20;
    g.beginPath(); g.arc(x, y, R, 0, TAU); g.stroke(); g.restore(); } }
  g.save(); g.translate(x, y); g.scale(appear, appear);
  // tick ring (48 ticks), staggered write-in
  g.strokeStyle = C.org; g.lineWidth = 2;
  for (let i=0;i<48;i++){ const q = eo(seg(f, T.s2+6+i*0.5, T.s2+16+i*0.5)); if (q<=0) continue; const a0 = -Math.PI/2 + i/48*TAU;
    const r0 = r+26, r1 = r0 + (i%4===0 ? 16 : 7)*q; g.beginPath(); g.moveTo(Math.cos(a0)*r0, Math.sin(a0)*r0); g.lineTo(Math.cos(a0)*r1, Math.sin(a0)*r1); g.stroke(); }
  g.lineWidth = 30; g.lineCap = 'round'; g.strokeStyle = 'rgba(17,17,17,0.09)'; g.beginPath(); g.arc(0,0,r,0,TAU); g.stroke();
  const end = -Math.PI/2 + TAU*val/100;
  if (val > 0.1){ g.save(); g.strokeStyle = hit ? C.red : C.ink;
    if (hit){ g.shadowColor = GLOW; g.shadowBlur = 26 + 30*(1-seg(f, T.ringB, T.ringB+30)); }
    g.beginPath(); g.arc(0,0,r,-Math.PI/2,end); g.stroke(); g.restore(); }
  if (hit){ const q = eio(seg(f, T.ringB+10, T.ringB+30)); g.save(); g.lineWidth = 8; g.lineCap='butt'; g.strokeStyle = C.org; g.setLineDash([8,9]);
    g.beginPath(); g.arc(0,0,r, end+0.16, end+0.16 + (TAU*0.25-0.32)*q); g.stroke(); g.restore(); }
  g.textAlign='center'; g.textBaseline='middle';
  g.font = font(22, 700); g.letterSpacing='6px'; g.fillStyle = C.ink; g.fillText('UP TO', 3, -60); g.letterSpacing='0px';
  const pop = hit ? 1 + 0.16*kick(f - T.ringB) : 1; g.save(); g.scale(pop, pop); g.font = font(96, 800);
  if (hit){ g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 24; } else g.fillStyle = C.ink;
  g.fillText(`${Math.round(val)}%`, 0, 16); g.restore();
  g.restore();
  if (hit){ g.save(); g.globalAlpha = seg(f, T.ringB+22, T.ringB+32); g.font = font(22, 700); g.letterSpacing='4px'; g.fillStyle = C.org;
    g.textAlign = 'left'; g.textBaseline='middle'; g.fillText('REST: MOVEMENT', x + r + 52, y + 96); g.fillText('+ DIGESTION', x + r + 52, y + 126); g.restore(); }
}

/* ---------- Scene 3: four levers ---------- */
const CARDS = [
  {n:'01', t:'Muscle Mass', d:'More muscle, higher burn at rest'},
  {n:'02', t:'Biological Age', d:'BMR slowly drops as you age'},
  {n:'03', t:'Genetic Sex', d:'Males usually burn more at rest'},
  {n:'04', t:'Total Body Size', d:'Bigger body, bigger baseline'} ];
function scene3(f){
  const s3x = 2160 - camX(f); if (f < T.push || s3x > 1100 || f >= T.s4) return;
  const away = i => 1 - eio(seg(f, T.wipe + i*4, T.wipe + i*4 + 9));   // fully cleared by frame 746, before scene 4
  // header
  const ha = away(0); if (ha > 0){ g.save(); g.translate(540 + s3x, 600); g.scale(ha, ha);
    g.font = font(104, 900); g.textBaseline='middle'; const w4 = g.measureText('4 ').width, wl = g.measureText('LEVERS').width, x0 = -(w4+wl)/2;
    g.textAlign='left'; g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 26; g.fillText('4', x0, 0); g.shadowBlur = 0; g.fillStyle = C.ink; g.fillText('LEVERS', x0+w4, 0);
    g.font = font(26, 700); g.letterSpacing = '9px'; g.textAlign='center'; g.fillStyle = C.org; g.fillText('WHAT SETS YOUR BMR', 4, 74); g.letterSpacing='0px';
    g.restore(); if (ha > 0.99 && s3x < 2) TEXT_LOG.push({id:'levers', text:'4 LEVERS what sets your bmr', x0:200, y0:540, x1:880, y1:690}); }
  CARDS.forEach((c, i) => {
    const fr = f - T.cards[i]; if (fr < 0) return; const a = away(i+1); if (a <= 0) return;
    const dir = i%2===0 ? 1 : -1, sp = spring(fr);
    const w = 860, h = 140, x = 110 + s3x + dir*(1-sp)*1150, y = 720 + i*170;
    g.save(); g.translate(x + w/2, y + h/2); g.scale(a, a); g.translate(-w/2, -h/2);
    const fp = f >= T.focus[i] ? 1 - seg(f, T.focus[i]+20, T.focus[i]+44) : 0;
    if (fp > 0){ g.save(); g.shadowColor = `rgba(207,117,43,${0.5*fp})`; g.shadowBlur = 36*fp; g.fillStyle = C.card; rr(0,0,w,h,h/2); g.fill(); g.restore(); }
    panel(0, 0, w, h, {r: h/2, lw: fp > 0 ? 2 : 1, stroke: fp > 0 ? C.red : C.ink});
    g.textBaseline='middle'; g.textAlign='left';
    g.font = font(34, 700); g.fillStyle = C.org; g.fillText(c.n, 64, 50); const nw = g.measureText(c.n).width;
    g.fillStyle = 'rgba(17,17,17,0.35)'; g.fillText(' //', 64+nw, 50); const lx = 64 + nw + g.measureText(' // ').width;
    g.font = font(44, 800); g.fillStyle = C.ink; g.fillText(c.t, lx, 50);
    g.font = font(25, 500); g.fillStyle = 'rgba(17,17,17,0.66)'; g.fillText(c.d, 64, 99);
    // crosshair anchors on landing
    const lf = fr - 8; if (lf >= 0){ const ls = spring(lf), cx = w - 84, cy = h/2, k = lerp(2.4, 1, ls);
      g.save(); g.translate(cx, cy); g.rotate((1-ls)*Math.PI/2); g.scale(k,k); g.globalAlpha = clamp(lf/4);
      g.strokeStyle = fp>0 ? C.red : C.ink; g.lineWidth = 2/k; g.beginPath(); g.arc(0,0,24,0,TAU); g.stroke();
      g.beginPath(); [[0,-38,0,-14],[0,14,0,38],[-38,0,-14,0],[14,0,38,0]].forEach(([a1,b1,c1,d1]) => { g.moveTo(a1,b1); g.lineTo(c1,d1); }); g.stroke();
      g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 10; g.beginPath(); g.arc(0,0,5,0,TAU); g.fill(); g.restore(); }
    g.restore();
    if (sp > 0.98 && a > 0.99) TEXT_LOG.push({id:'card'+i, text:`${c.n} // ${c.t} ${c.d}`, x0:x, y0:y, x1:x+w, y1:y+h});
  });
}

/* ---------- Scene 4: the golden rule ---------- */
function scene4(f){
  if (f < T.warn) return;
  const s = spring(f - T.warn), cx = 540, cy = 930, w = 960, h = 500;
  g.save(); g.translate(cx, cy); g.scale(s, s);
  const pulse = 0.5 + 0.5*Math.cos((f - T.warn)*TAU/36);       // soft opacity loop, 1.2 s
  g.save(); g.shadowColor = 'rgba(17,17,17,0.10)'; g.shadowBlur = 40; g.shadowOffsetY = 12; g.fillStyle = C.card; rr(-w/2,-h/2,w,h,28); g.fill(); g.restore();
  g.save(); g.globalAlpha = 0.45 + 0.55*pulse; g.strokeStyle = C.red; g.lineWidth = 3; g.shadowColor = GLOW; g.shadowBlur = 14 + 18*pulse;
  rr(-w/2+1.5,-h/2+1.5,w-3,h-3,28); g.stroke(); g.restore();
  // warning glyph + tracked label
  g.save(); g.translate(-176, -h/2 + 62); g.strokeStyle = C.red; g.lineWidth = 4; g.lineJoin='round';
  g.beginPath(); g.moveTo(0,-19); g.lineTo(21,17); g.lineTo(-21,17); g.closePath(); g.stroke();
  g.fillStyle = C.red; g.fillRect(-2,-7,4,13); g.beginPath(); g.arc(0,11.5,2.8,0,TAU); g.fill(); g.restore();
  g.font = font(24, 700); g.letterSpacing = '8px'; g.fillStyle = C.red; g.textAlign='left'; g.textBaseline='middle'; g.fillText('WARNING BLOCK', -138, -h/2 + 64); g.letterSpacing='0px';
  g.restore();
  // the rule: two clean lines, slammed in with a 4-frame stagger
  const L = [ {t:'RULE #1:', y: cy - 40, px: 150}, {t:'NEVER EAT BELOW YOUR BMR.', y: cy + 120, px: 0} ];
  L.forEach((ln, i) => { const lf = f - (T.rule + i*4); if (lf < 0) return; const sp = spring(lf);
    let px = ln.px; if (!px){ g.font = font(100, 900); px = 100*Math.min(1, 880/g.measureText(ln.t).width); }
    g.save(); g.translate(540, ln.y - (1-sp)*220); const k = lerp(i === 0 ? 1.35 : 1.08, 1, sp); g.scale(k, k); g.globalAlpha = clamp(lf/3)*s;
    g.font = font(px, 900); g.textAlign='center'; g.textBaseline='middle';
    if (i === 1){ const pre = 'NEVER EAT BELOW YOUR ', w1 = g.measureText(pre).width, w2 = g.measureText('BMR.').width, x0 = -(w1+w2)/2;
      g.textAlign='left'; g.fillStyle = C.ink; g.fillText(pre, x0, 0); g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 22; g.fillText('BMR.', x0 + w1, 0); }
    else { g.fillStyle = C.ink; g.fillText(ln.t, 0, 0); }
    g.restore(); });
  if (f >= T.rule + 8) TEXT_LOG.push({id:'rule', text:'RULE #1: NEVER EAT BELOW YOUR BMR.', x0:100, y0:700, x1:980, y1:1160});
  // prompt slides up + spring chevron
  const pf = f - T.prompt; if (pf >= 0){ const sp = spring(pf);
    g.save(); g.globalAlpha = clamp(pf/4); g.translate(0, (1-sp)*60); g.font = font(42, 600);
    const Lp = wrap(words("Comment 'BMR' to calculate your baseline.", ['BMR']), 940); drawWords(Lp, 540, 1265, 54, null); g.restore();
    const cf = pf - 4; if (cf >= 0){ const cs = spring(cf), bob = Math.max(0, Math.sin((cf-10)*0.33))*12*clamp((cf-10)/6), y = lerp(1300, 1360, cs) + bob;
      g.save(); g.globalAlpha = clamp(cf/4); g.strokeStyle = C.red; g.lineWidth = 10; g.lineCap='round'; g.lineJoin='round'; g.shadowColor = GLOW; g.shadowBlur = 26;
      g.beginPath(); g.moveTo(504, y-14); g.lineTo(540, y+20); g.lineTo(576, y-14); g.stroke();
      g.globalAlpha *= 0.45; g.beginPath(); g.moveTo(514, y-42); g.lineTo(540, y-18); g.lineTo(566, y-42); g.stroke(); g.restore(); }
    if (pf > 4) TEXT_LOG.push({id:'prompt', text:"Comment 'BMR' to calculate your baseline.", x0:100, y0:1240, x1:980, y1:1300}); }
}

/* ---------- push transition edge (UI expand grammar) ---------- */
function pushEdge(f){
  [[T.s2, 'pan'], [T.push, 'push']].forEach(([t0]) => { const p = spring(f - t0); if (p <= 0.02 || p >= 0.98) return;
    const ex = W*(1-p); g.save(); g.fillStyle = C.red; g.shadowColor = GLOW; g.shadowBlur = 24; g.globalAlpha = 0.9*(1 - Math.abs(p-0.5)*1.4);
    g.fillRect(ex-2, SAFE_TOP+90, 4, SAFE_BOT-SAFE_TOP-90); g.restore(); });
}

/* ---------- master ---------- */
function renderFrame(f){
  TEXT_LOG.length = 0;
  g.setTransform(1,0,0,1,0,0); g.globalAlpha = 1; g.shadowBlur = 0; g.shadowOffsetY = 0; g.setLineDash([]); g.letterSpacing = '0px';
  stage(f); draw3D(f); track3D(f);
  g.setTransform(US, 0, 0, US, UTX, UTY);
  hud(f); scene12(f); scene3(f); pushEdge(f); scene4(f);
  g.setTransform(1,0,0,1,0,0);
}
window.DUR = TOTAL/FPS;
window.renderFrame = renderFrame;
window.render = t => renderFrame(Math.round(t*FPS));
window.TEXTS = t => { renderFrame(Math.round(t*FPS)); return TEXT_LOG.slice(); };
window.ready = new Promise(res => { const c = () => window.r3dReady ? res() : setTimeout(c, 20); c(); }).then(() => Promise.all([document.fonts.load('900 100px Mont'), document.fonts.load('600 40px Mont'), document.fonts.load('800 40px Mont')]))
  .then(() => { renderFrame(0); window.READY = true; return true; });
</script></body></html>
