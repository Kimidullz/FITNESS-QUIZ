name: Encrypt private plans

# Copies the private-plans artifact from an API build run, encrypts it to the
# certificate in .github/keys (only Claude's session holds the key) and commits
# the encrypted file. The plans are never stored readable in this public repo.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "API build run id that made private-plans"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-plans
          path: private-out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          mkdir -p enc
          openssl cms -encrypt -binary -aes256 -in private-out/plans.json -outform DER -out enc/plans.json.cms .github/keys/plans-cert.pem
          git config user.name "api-build"
          git config user.email "api-build@users.noreply.github.com"
          git add enc/plans.json.cms
          git commit -m "Encrypted private plans"
          git pull --rebase && git push
