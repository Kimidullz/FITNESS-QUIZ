name: API build (food pages + quiz notes)

# Manual only. Uses the ANTHROPIC_API_KEY secret (Kimi's credit, expires 12 Dec 2026).
# Output is committed as plain JSON/HTML, so the site keeps working without the API.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "What to make"
        type: choice
        options: [foods, notes, all, extras, foods-en, exercises, ramadan, plans, wanita, build-only]
        default: foods
      limit:
        description: "Foods only: how many new foods at most (empty = all)"
        default: ""

permissions:
  contents: write

concurrency: api-build

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.8,<3"
      - name: Generate
        if: inputs.job != 'build-only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ inputs.job }}" in
            foods|notes|all) python seo/generate.py ${{ inputs.job }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} ;;
            wanita) python seo/generate3.py wanita ;;
            *) python seo/generate2.py ${{ inputs.job }} ;;
          esac
      - name: Build pages
        if: always()
        run: python seo/build.py && python seo/build2.py && python seo/build3.py
      - name: Keep private plans as a download (not committed)
        if: always() && hashFiles('private-out/plans.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: private-plans
          path: private-out/
          retention-days: 30
      - name: Save to repo
        if: always()
        run: |
          git config user.name "api-build"
          git config user.email "api-build@users.noreply.github.com"
          for f in seo/data seo/data-en seo/exercises seo/ramadan.json results kalori calories senaman ramadan semak workout seo/wanita wanita sitemap.xml; do [ -e "$f" ] && git add -A "$f" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "API build: ${{ inputs.job }}"
          git pull --rebase && git push
