name: WhatsApp bot

on:
  push:
    branches: [main]
    paths: ["whatsapp-bot/**", ".github/workflows/whatsapp-bot.yml"]
  pull_request:
    paths: ["whatsapp-bot/**", ".github/workflows/whatsapp-bot.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = put the bot online, test = practice chats with Claude (no WhatsApp)"
        type: choice
        options: [deploy, test]
        default: test

concurrency: whatsapp-bot

defaults:
  run:
    working-directory: whatsapp-bot

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  practice:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'test'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Practice chats (results show on this run's Summary page)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run try

  deploy:
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip if Cloudflare isn't set up yet
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not added yet, so the bot was not deployed. See whatsapp-bot/README.md step B."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'yes'
        run: npm ci
      - name: Find or create the bot's memory store
        if: steps.ready.outputs.go == 'yes'
        run: |
          TITLE=wdt-lead-bot-memory
          ID=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>x.title===process.argv[1]);console.log(n?n.id:"")})' "$TITLE")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$TITLE" > kv.txt
            cat kv.txt
            ID=$(grep -oE '[0-9a-f]{32}' kv.txt | head -1)
          fi
          [ -n "$ID" ] || { echo "Could not get the KV id"; exit 1; }
          sed -i "s/KV_ID_PLACEHOLDER/$ID/" wrangler.toml
      - name: Deploy
        if: steps.ready.outputs.go == 'yes'
        run: npx wrangler deploy
      - name: Send the secret keys to the bot
        if: steps.ready.outputs.go == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          KIMI_WHATSAPP: ${{ secrets.KIMI_WHATSAPP }}
          ZARA_WHATSAPP: ${{ secrets.ZARA_WHATSAPP }}
          LEADS_SHEET_URL: ${{ secrets.LEADS_SHEET_URL }}
          LEAD_ALERT_TEMPLATE: ${{ secrets.LEAD_ALERT_TEMPLATE }}
          BOT_MODEL: ${{ secrets.BOT_MODEL }}
        run: |
          node -e '
            const names = ["ANTHROPIC_API_KEY","WHATSAPP_TOKEN","WHATSAPP_PHONE_NUMBER_ID","WHATSAPP_APP_SECRET","WHATSAPP_VERIFY_TOKEN","KIMI_WHATSAPP","ZARA_WHATSAPP","LEADS_SHEET_URL","LEAD_ALERT_TEMPLATE","BOT_MODEL"];
            const out = {}; const missing = [];
            for (const n of names) { if (process.env[n]) out[n] = process.env[n]; else missing.push(n); }
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("Sending:", Object.keys(out).join(", ") || "none");
            if (missing.length) console.log("Not set (fine if optional):", missing.join(", "));
          '
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
