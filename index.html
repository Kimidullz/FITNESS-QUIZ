// ---------- meal calculator ----------
const PLANS = [1200,1500,1800,2000,2300];   // pdf/meal-plan-{plan}-{lang}.pdf, built by mealplan/build.js
const GAIN_PLANS = [1500,1800,2100,2400,2700,3000];   // pdf/weight-gain-{plan}-{lang}.pdf, same builder
const GAIN_PROTEIN = [1.6,1.7,1.8,1.9,2.0];   // g per kg body weight, by activity level (index of c-act)
const GAIN_TIPS = [{ms:"Latihan kekuatan 3 kali seminggu, supaya yang naik lebih banyak otot, bukan lemak",en:"Strength training 3 times a week, so more of the gain is muscle, not fat"},
  {ms:"Timbang seminggu sekali. Berat tak naik selepas 2 minggu? Tambah segelas susu penuh krim (+160 kcal)",en:"Weigh yourself once a week. No gain after 2 weeks? Add a glass of full-cream milk (+160 kcal)"},
  {ms:"Naik lebih 0.5 kg seminggu? Kurangkan 1 snek, sebab yang naik laju selalunya lemak",en:"Gaining more than 0.5 kg a week? Drop 1 snack, because fast gain is usually fat"}];
const TIPS = [{ms:"Teh tarik → teh O kosong: jimat ~100 kcal",en:"Teh tarik → teh O kosong: saves ~100 kcal"},
  {ms:"Goreng → bakar, rebus atau air fryer: jimat ~100 kcal",en:"Fried → grilled, boiled or air fryer: saves ~100 kcal"},
  {ms:"Separuh pinggan sayur dulu, baru nasi dan lauk",en:"Fill half your plate with vegetables first, then rice and protein"}];
const calc = { sex:null, goal:"loss" };
const r50 = n => Math.round(n/50)*50;
// Mifflin-St Jeor x activity, deficit of up to 500 kcal (max 20%), never below 1200 (women) / 1500 (men)
const tdee = (sex, age, cm, kg, act) => (10*kg + 6.25*cm - 5*age + (sex==="m" ? 5 : -161)) * [1.2,1.375,1.45,1.55,1.725][act];
function calories(sex, age, cm, kg, act){
  const t = tdee(sex, age, cm, kg, act);
  return Math.max(sex==="m" ? 1500 : 1200, t - Math.min(500, t*0.2));
}
// weight gain without much fat: small surplus of 12%, kept between 250 and 400 kcal (about 0.25-0.5 kg a week)
const gainCalories = (...a) => { const t = tdee(...a); return t + Math.min(400, Math.max(250, t*0.12)); };
// 1.6 g/kg, using a BMI-27 weight cap so bigger bodies don't get unrealistic targets
const protein = (cm, kg) => Math.round(1.6 * Math.min(kg, 27*(cm/100)**2) / 5) * 5;
console.assert(Math.round(calories("f",30,160,65,0))===1285 && protein(160,65)===105 && calories("f",60,150,45,0)===1200 && Math.round(gainCalories("m",25,170,55,2))===2424, "calculator self-check");

function calcLang(){
  const act = $("c-act").value;
  $("c-act").innerHTML = T.calActs.map((a,k)=>`<option value="${k}">${a}</option>`).join("");
  if(act) $("c-act").value = act;

  const gain = calc.goal==="gain";

  calLabels();
  if(!$("c-out").hidden || $("c-err").textContent) runCalc();   // also redo a showing error in the new language
}
// set again in runCalc, so the result always shows the labels of the goal it was calculated for
function calLabels(){
  const gain = calc.goal==="gain", f = GAIN_PROTEIN[+$("c-act").value || 0].toFixed(1);
  for (const k of ["calKitH","calKit","calNote","calPerDay","calProDay","calStart"]) document.querySelector(`[data-t="${k}"]`).innerHTML = T[gain ? k+"G" : k].replace("%F", f);
}
function runCalc(){
  const age=+$("c-age").value, cm=+$("c-ht").value, kg=+$("c-wt").value, err=$("c-err");
  $("c-out").hidden = true; err.textContent = "";
  if($("c-preg").checked){
    const z = CONFIG.coaches.f;
    err.innerHTML = `${T.calErrPreg} <a href="https://wa.me/${z.whatsapp}?text=${encodeURIComponent(T.calPregMsg)}" target="_blank" rel="noopener">${T.calPregWa}</a>`;
    err.querySelector("a").onclick = ()=>logTap({type:"quiz", via:"Calculator mum WhatsApp", src:"website", coach:z.name});
    return;
  }
  if(!calc.sex || !age || !cm || !kg){ err.textContent = T.calErrFill; return; }
  if(age < 18){ err.textContent = T.calErrAge; return; }
  if(cm<130 || cm>220 || kg<35 || kg>250 || age>90){ err.textContent = T.calErrRange; return; }
  const gain = calc.goal==="gain", bmi = kg/((cm/100)**2);
  if(!gain && bmi < 18.5){ err.textContent = T.calErrUnder; return; }
  if(gain && bmi < 16){ err.textContent = T.calErrLow; return; }
  if(gain && bmi >= 23){ err.textContent = T.calErrGainHigh; return; }   // Asian cut-off (Malaysian CPG): 23+ is overweight
  const act = +$("c-act").value, k = (gain ? gainCalories : calories)(calc.sex, age, cm, kg, act);
  calLabels();
  // ties go to the higher plan
  const tier = String((gain ? GAIN_PLANS : PLANS).reduce((a,b)=> Math.abs(b-k) <= Math.abs(a-k) ? b : a));
  // gain: 1.6-2 g per kg body weight by activity (BMI is under 23 here, so no cap); loss: kept inside the PDF's range
  const pro = gain ? Math.round(GAIN_PROTEIN[act]*kg/5)*5
    : Math.min(Math.max(protein(cm, kg), {1200:80,1500:90,1800:100,2000:100,2300:115}[tier]), {1200:100,1500:110,1800:120,2000:125,2300:135}[tier]);
  const burn = tdee(calc.sex, age, cm, kg, act), tight = !gain && burn - k < 250;   // the 1,200/1,500 floor leaves little or no deficit
  const lo = gain ? r50(k-100) : Math.max(calc.sex==="m" ? 1500 : 1200, r50(k-100));
  const range = tight ? `~${lo.toLocaleString()}` : `${lo.toLocaleString()}–${(lo+200).toLocaleString()}`;
  $("c-kcal").textContent = range + " kcal"; $("c-pro").textContent = pro + " g";
  $("c-rem").href = calReminder(); $("c-rem").hidden = gain;   // the Day 7 check-in measures waist loss
  // explain whenever the PDF's calories fall outside the range shown (gain tiers are 300 apart)
  const extra = tight ? T.calFloor : k > +tier + (gain ? 100 : 150) ? (gain ? T.calHigherG : T.calHigher) : +tier > k + 100 ? (gain ? T.calGainLess : T.calLower) : "";
  $("c-tips").innerHTML = (extra ? [`<li>${extra.replace("%K", (+tier).toLocaleString()).replace("%D", r50(Math.abs(+tier - k))).replace("%T", r50(burn).toLocaleString())}</li>`] : []).concat((gain ? GAIN_TIPS.filter((t,i)=> i!==1 || extra!==T.calGainLess) : TIPS).map(t=>`<li>${L(t)}</li>`)).join("");
  $("c-pdf").href = `pdf/${gain ? "weight-gain" : "meal-plan"}-${tier}-${LANG}.pdf`;
  $("c-pdfBtn").textContent = (gain ? T.calPdfG : T.calPdf).replace("%K", (+tier).toLocaleString());
  $("c-inapp").hidden = !/TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV/i.test(navigator.userAgent);
  $("c-pdf").onclick = gain ? ()=>logTap({type:"quiz", via:"Weight gain PDF", src:"website", result:tier+" kcal"})
    : ()=>{ kitSave({p:tier}); kitMark("m"); logTap({type:"quiz", via:"Meal plan PDF", src:"website", result:tier+" kcal"}); };
  calNext();
  $("c-out").hidden = false;
}
function calNext(){
  const done = view==="result", gain = calc.goal==="gain", q = s => document.querySelector(".c-next " + s);
  q("b").innerHTML = gain ? T.calNextHG : T.calNextH;
  q("p").innerHTML = gain ? T.calNextPG : done ? T.calNextP2 : T.calNextP;
  q(".btn").innerHTML = done ? T.calNextBtn2 : T.calNextBtn; q(".btn").style.display = gain ? "none" : "";   // the quiz is about fat loss
  q(".assess").innerHTML = gain ? T.calAssessG : T.calAssess;
}
$("c-sex").querySelectorAll("button").forEach(b=>b.onclick=()=>{ calc.sex = b.dataset.v; calcLang(); });
$("c-goal").querySelectorAll("button").forEach(b=>b.onclick=()=>{ const retry = !!$("c-err").textContent; calc.goal = b.dataset.v; $("c-err").textContent = ""; calcLang(); if(retry) runCalc(); calNext(); });
$("c-act").onchange = ()=>{ if(!$("c-out").hidden) runCalc(); };
$("c-go").onclick = ()=>{ runCalc(); if(!$("c-out").hidden) $("c-kcal").scrollIntoView({behavior:"smooth",block:"center"}); };

// ---------- Kit Mula 7 Hari: ticks + start date saved in this browser only ----------
const SITE_URL = "https://kimidullz.github.io/FITNESS-QUIZ/";
function kitGet(){ try{ return JSON.parse(localStorage.getItem("kit7")) || {}; }catch(e){ return {}; } }
function kitSave(o){ try{ localStorage.setItem("kit7", JSON.stringify(Object.assign(kitGet(), o))); }catch(e){} }
function kitMark(k){
  const n = new Date();   // local date, so day 1 is the visitor's own today
  if(!kitGet()[k]) kitSave({[k]: n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")});   // first time only: the meal plan date starts the 7 days
  kitRender();
}
const kitDay = () => { const m = kitGet().m; return m ? Math.floor((Date.now() - new Date(m+"T00:00:00")) / 864e5) + 1 : 0; };
function kitRender(){
  const kit = kitGet(), d = kitDay();
  document.querySelectorAll(".kit-steps a").forEach((a,n)=>{ const done = !!kit[a.dataset.k]; a.classList.toggle("done", done); a.querySelector("i").textContent = done ? "✓" : n+1; });
  $("kit-note").innerHTML = d >= 7 ? T.kitDone : d >= 1 ? T.kitDay.replace("%D", d) : T.kitNote;
  if(d >= 7) $("hari7").hidden = false;
}
// Google Calendar all-day event 7 days after today, linking back to the Day 7 check-in
function calReminder(){
  const day = n => { const x = new Date(Date.now() + n*864e5); return x.getFullYear() + String(x.getMonth()+1).padStart(2,"0") + String(x.getDate()).padStart(2,"0"); };
  const url = SITE_URL + (LANG==="en" ? "?lang=en" : "") + "#hari7";
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({action:"TEMPLATE", text:T.calRemT, dates:day(6)+"/"+day(7), details:T.calRemD + url});
}
function h7Lang(){
  [["h7-e",T.h7Energies],["h7-h",T.h7Hungers]].forEach(([id,opts])=>{ const v = $(id).value; $(id).innerHTML = opts.map((o,k)=>`<option value="${k}">${o}</option>`).join(""); if(v) $(id).value = v; });
  h7Update();
}
function h7Update(){
  const w1 = +$("h7-w1").value, w7 = +$("h7-w7").value, t = $("h7-t").value, e = +$("h7-e").value, h = +$("h7-h").value;
  const drop = Math.round((w1 - w7)*10)/10;
  $("h7-out").innerHTML = w1 && w7 ? (drop > 4 ? T.h7Check : drop >= 1 ? T.h7Down.replace("%D", drop) : T.h7Same) : "";
  const kit = kitGet();
  const lines = [kit.n ? `${T.h7L[4]}: ${kit.n}` : null, kit.p ? `${T.h7L[5]}: ~${(+kit.p).toLocaleString()} kcal` : null,
    w1 && w7 ? `${T.h7L[0]}: ${w1} → ${w7} cm` : null, t !== "" ? `${T.h7L[1]}: ${t}/35` : null,
    e ? `${T.h7L[2]}: ${T.h7Energies[e]}` : null, h ? `${T.h7L[3]}: ${T.h7Hungers[h]}` : null].filter(Boolean);
  $("h7-wa").innerHTML = "";
  Object.keys(CONFIG.coaches).sort((x,y)=>(y===kit.c)-(x===kit.c)).map(k=>CONFIG.coaches[k]).forEach(c=>{   // the coach they picked in the quiz first
    const a = document.createElement("a");
    a.className = "btn wa"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = T.h7Btn.replace("%C", c.name);
    a.href = `https://wa.me/${c.whatsapp}?text=${encodeURIComponent([T.h7Msg.replace("%C", c.name), ...lines, T.h7MsgEnd].join("\n"))}`;
    a.onclick = ()=>logTap({type:"quiz", via:"Hari 7 WhatsApp", src:"website", coach:c.name});
    $("h7-wa").appendChild(a);
  });
}
["h7-w1","h7-w7","h7-t","h7-e","h7-h"].forEach(id=>$(id).addEventListener("input", h7Update));
function h7Open(){ if(location.hash !== "#hari7") return; $("hari7").hidden = false; $("hari7").scrollIntoView(); }
window.addEventListener("hashchange", h7Open);

applyLang();
h7Open(); window.addEventListener("load", h7Open);   // again after fonts/images settle
const onScreen = {};
const floatObs = new IntersectionObserver(es=>{ es.forEach(e=>onScreen[e.target.className]=e.isIntersecting); document.querySelector(".wa-float").hidden = Object.values(onScreen).some(Boolean); }, {rootMargin:"-30% 0px -30% 0px"});
floatObs.observe($("quiz-zone")); floatObs.observe(document.querySelector(".hero")); floatObs.observe(document.querySelector(".c-next")); floatObs.observe($("hari7"));
$("r-dot").style.left = "4%";
$("start").onclick = ()=>{ firstName = ($("name").value.trim().split(/\s+/)[0] || "").replace(/[<>&"]/g,""); i=0; answers=[]; show("quiz"); render(); };
$("name").addEventListener("keydown", e=>{ if(e.key==="Enter") $("start").click(); });
$("back").onclick = ()=>{ if(i>0){ i--; render(); } };
$("retake").onclick = ()=>{ i=0; answers=[]; quizId=null; ctx={}; show("intro"); };
</script>
