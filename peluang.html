<style>
  :root{
    --sc-canvas:#0B0B0B; --sc-surface:#151515; --sc-ink:#F4F4F2; --sc-ink-soft:#A9A6A0;
    --sc-accent:#FFD200; --sc-accent-ink:#0B0B0B;
    --sc-font-display:Anton,Impact,"Arial Narrow",sans-serif;
    --sc-font-text:Montserrat,system-ui,sans-serif;
    --red:#E30613;
  }
  [hidden]{display:none!important}
  p,h1,h2{margin:0}
  .pf{font-family:var(--sc-font-display);font-weight:400;font-style:italic;text-transform:uppercase;line-height:.98;letter-spacing:.005em}

  /* fixed chrome: mark, "for: X · change" chip, language */
  .bar{position:fixed;inset:0 0 auto;z-index:60;display:flex;align-items:center;gap:8px;padding:12px var(--sc-gutter);pointer-events:none}
  .bar>*{pointer-events:auto}
  .mark{position:relative;width:46px;height:30px;background:#000;border:1.5px solid #fff;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;text-decoration:none;font:italic 15px/1 var(--sc-font-display)}
  .mark::after{content:"";position:absolute;right:-6px;bottom:-4px;width:18px;height:40px;background:linear-gradient(90deg,var(--red) 0 50%,var(--sc-accent) 50% 100%);transform:skewX(-28deg)}
  .mark span{position:relative;z-index:1}
  .bar__r{margin-left:auto;display:flex;gap:8px;align-items:center}
  .chip,.lang{background:#000;border:1.5px solid rgba(255,255,255,.3);border-radius:99px;color:#fff;font:700 12px/1 var(--sc-font-text)}
  .chip{padding:10px 13px;cursor:pointer;white-space:nowrap}
  .chip b{color:var(--sc-accent)}
  .chip u{text-underline-offset:2px}
  .lang{display:flex;overflow:hidden}
  .lang button{background:none;border:0;color:#fff;font:inherit;padding:10px 11px;cursor:pointer;opacity:.6}
  .lang button.on{background:#fff;color:#000;opacity:1}

  /* a state inside a pinned stage */
  .st{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:84px var(--sc-gutter) 40px}

  /* act 1: the poster and the picker */
  .planes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .plus{position:absolute;aspect-ratio:1}
  .plus--back{width:min(80vmax,1150px);right:-24%;top:-14%}
  .plus--back path{fill:none;stroke:var(--sc-accent);stroke-width:1.5px;vector-effect:non-scaling-stroke}
  .plus--mid{width:min(30vmax,420px);right:5%;bottom:7%}
  .plus--mid path{fill:var(--red)}
  .stripes{position:absolute;display:flex;transform:skewX(-28deg)}
  .stripes i{flex:1;background:var(--red)}
  .stripes i+i{background:var(--sc-accent)}
  .planes .stripes{right:-6%;bottom:30%;width:min(44vw,600px);height:clamp(16px,2.6vw,40px)}
  /* the red plus and the stripes grow and clear out as the picker arrives, so nothing sits behind the choices */
  .plus--mid,.planes .stripes{opacity:calc(1 - var(--sc-p,0) * 2.6)}
  @media (prefers-reduced-motion:no-preference){
    .plus--back{transform:scale(calc(1 + var(--sc-p,0) * .5))}
    .plus--mid{transform:translate3d(calc(var(--sc-p,0) * 8vw),calc(var(--sc-p,0) * 10vh),0) scale(calc(1 + var(--sc-p,0) * 1.6))}
    .planes .stripes{transform:translate3d(calc(var(--sc-p,0) * -40vw),0,0) skewX(-28deg)}
  }
  .kicker{font:800 var(--sc-t-xs)/1.3 var(--sc-font-text);letter-spacing:.16em;text-transform:uppercase;color:var(--sc-accent);margin-bottom:1.1rem}
  .h1{font-size:min(13.4vw,24vh);max-width:9.5em}
  .keep{max-width:30ch;font-weight:600;font-size:var(--sc-t-lg);line-height:1.4;margin-top:1.5rem}
  .pick h2{font-size:clamp(2.4rem,6vw,6rem)}
  .types{display:flex;flex-wrap:wrap;align-items:center;gap:.08em .32em;margin-top:.5em;font-size:clamp(1.5rem,3.9vw,4.2rem)}
  .types button{background:none;border:0;color:var(--sc-ink);font:italic 400 1em/1 var(--sc-font-display);text-transform:uppercase;padding:.1em .16em .06em;min-height:44px;cursor:pointer;border-radius:3px}
  .types button[aria-pressed="true"]{background:var(--sc-accent);color:var(--sc-accent-ink)}
  @media (hover:hover){.types button:hover{color:var(--sc-accent)}.types button[aria-pressed="true"]:hover{color:var(--sc-accent-ink)}}
  .types .sep{color:var(--red);font:italic .7em/1 var(--sc-font-display)}
  .pickline{max-width:40ch;margin-top:1.4rem;font-weight:600;font-size:var(--sc-t-base);color:var(--sc-ink)}
  .pick:focus-within{opacity:1!important;pointer-events:auto!important}

  /* act 2: their pressures */
  .a2{padding:clamp(4rem,14vh,10rem) 0 clamp(4rem,12vh,9rem)}
  .pains{display:grid;gap:clamp(1.4rem,5vh,3.4rem)}
  .pain{font-size:clamp(2.2rem,5.4vw,5.6rem);max-width:13em;color:var(--sc-ink-soft)}
  .pain:nth-child(2){justify-self:end;text-align:right}
  .pain:nth-child(3){color:var(--sc-ink);font-size:clamp(2.6rem,7vw,7.4rem)}

  /* act 3: the gap question (peak) */
  .label{font-size:clamp(1.7rem,3.2vw,3.2rem);color:var(--sc-ink-soft);margin-bottom:clamp(.8rem,2.4vh,1.4rem)}
  .gap{margin-inline:calc(-1 * var(--sc-gutter));padding:clamp(1rem,3vh,2rem) var(--sc-gutter);background:var(--sc-accent);color:var(--sc-accent-ink)}
  .gap p{font-size:clamp(2rem,4.9vw,5.4rem);max-width:19em;line-height:1.02}
  .pitch{max-width:46ch;margin-top:clamp(1.2rem,4vh,2.4rem);font-weight:500;font-size:var(--sc-t-lg);line-height:1.5}
  .next{max-width:46ch;margin-top:1.3rem;padding-left:14px;border-left:3px solid var(--red);font-weight:600;font-size:var(--sc-t-base);line-height:1.45}
  .next b{display:block;font:800 var(--sc-t-xs)/1.3 var(--sc-font-text);letter-spacing:.14em;text-transform:uppercase;color:var(--sc-accent);margin-bottom:4px}
  .stripes--a3{top:96px;right:-3%;width:min(30vw,380px);height:clamp(12px,1.8vw,26px)}

  /* act 4: what it actually is */
  .a4{display:grid;gap:clamp(2.4rem,6vw,6rem)}
  @media (min-width:900px){.a4{grid-template-columns:minmax(260px,360px) minmax(0,1fr);align-items:start}.a4__vid{position:sticky;top:90px}}
  .a4 video{width:100%;max-width:360px;aspect-ratio:9/16;background:#000;border-radius:6px}
  .intro{max-width:820px}
  .intro video.wide{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
  .intro .vnote{max-width:820px}
  #intro{padding-top:calc(var(--sc-gutter,16px) + 72px)}
  .vwrap{position:relative}
  .unmute{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#E30613;color:#fff;border:0;border-radius:999px;padding:.8rem 1.3rem;font:700 1rem Montserrat,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .unmute[hidden]{display:none}
  .vlabel{font-size:var(--sc-t-lg,1.6rem);margin-bottom:1rem;line-height:1.1}
  .vnote{max-width:360px;margin-top:.6rem;font-size:var(--sc-t-xs);color:var(--sc-ink-soft)}
  .block+.block{margin-top:clamp(3rem,8vh,5rem)}
  .h2{font-size:var(--sc-t-2xl);margin-bottom:1rem}
  .item{max-width:56ch;padding:.9rem 0;border-top:1px solid var(--sc-hairline)}
  .item b{display:block;color:var(--sc-ink)}
  .item span{color:var(--sc-ink-soft)}
  .motto{margin-top:2rem;font-size:var(--sc-t-xl);color:var(--sc-accent)}
  details{max-width:56ch;border-top:1px solid var(--sc-hairline)}
  details:last-of-type{border-bottom:1px solid var(--sc-hairline)}
  summary{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;font-weight:700;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font:800 1.4em/1 var(--sc-font-text);color:var(--sc-accent)}
  details[open] summary::after{content:"\2212"}
  details p{padding:0 0 1.1rem;color:var(--sc-ink-soft)}
  .note{margin-top:1.4rem;font-weight:800}

  /* act 5: the quiet close */
  .close{max-width:34rem}
  .close__for{font-size:var(--sc-t-sm);color:var(--sc-ink-soft)}
  .close__for b{color:var(--sc-ink)}
  .close__q{font-size:clamp(1.9rem,3vw,2.6rem);margin-top:1.1rem}
  .close__hint{font-size:var(--sc-t-sm);color:var(--sc-ink-soft);margin-top:.5rem}
  .slots{margin-top:.6rem}
  .slot{display:flex;align-items:center;min-height:48px;color:var(--sc-ink);text-decoration:none;font-weight:700;font-size:1.25rem}
  .slot span{text-decoration:underline;text-decoration-color:var(--sc-accent);text-decoration-thickness:2px;text-underline-offset:.24em}
  @media (hover:hover){.slot:hover{color:var(--sc-accent)}}
  .close__other{display:inline-flex;align-items:center;min-height:44px;margin-top:.3rem;font-size:var(--sc-t-sm);color:var(--sc-ink-soft)}
  .close__soft{margin-top:1rem;font-size:var(--sc-t-sm);color:var(--sc-ink-soft)}
  .foot{position:absolute;z-index:1;left:var(--sc-gutter);right:var(--sc-gutter);bottom:max(16px,env(safe-area-inset-bottom));font-size:11px;line-height:1.5;color:var(--sc-ink-soft)}
  .foot a{color:var(--sc-ink);font-weight:700}

  /* the signature: every rewritable line wipes out and back in */
  [data-rw]{display:block;clip-path:inset(0 0 0 0);transition:clip-path .18s cubic-bezier(.77,0,.175,1)}
  .slot [data-rw]{display:inline}
  [data-rw].rw-out{clip-path:inset(0 0 0 100%)}
  [data-rw].rw-pre{clip-path:inset(0 100% 0 0);transition:none}

  @media (max-width:700px){
    .h1{font-size:min(23vw,15vh)}
    .pick h2{font-size:11vw}
    .types{font-size:min(7.6vw,4.6vh)}
    .plus--back{width:130vw;right:-78vw;top:-22%}
    .plus--mid{width:26vw;right:6%;bottom:3%}
    .planes .stripes{bottom:11%;width:52vw}
    .stripes--a3{top:70px}
    .label{font-size:7.4vw}
  }
  @media (max-height:700px){
    .st{padding-top:70px}
    .gap p{font-size:min(4.9vw,4.4vh)}
    .pitch{font-size:var(--sc-t-base)}
  }
</style>

<header class="bar">

<main>
  <!-- 0 INTRO: flow, first thing on the page; autoplays muted (Malay captions burned in). Jorge's 4-minute introduction to the opportunity. -->
  <section id="intro" class="sc-section" data-sc-act="flow">
    <div class="sc-wrap intro" data-sc-in>
      <p class="pf vlabel" data-t="vlabel2"></p>
      <div class="vwrap"><video id="jorgeVid" class="wide" autoplay muted playsinline controls preload="auto" poster="video/jorge-wdt-poster.jpg">
        <source src="video/jorge-wdt-ms.mp4" type="video/mp4">
      </video><button type="button" id="unmute" class="unmute" data-t="unmute"></button></div>
      <p class="vnote" data-t="vnote2"></p>
    </div>
  </section>

  <!-- 1 CURIOSITY: pin. The promise lands whole, then the picker takes its place. -->
  <section id="a1" data-sc-act="pin" data-sc-span="1.9" data-sc-drift="#0B0B0B">
    <div data-sc-stage>
      <div class="planes" aria-hidden="true">
        <svg class="plus plus--back" viewBox="0 0 24 24"><path d="M9 1h6v8h8v6h-8v8H9v-8H1V9h8z"/></svg>
        <svg class="plus plus--mid" viewBox="0 0 24 24"><path d="M9 1h6v8h8v6h-8v8H9v-8H1V9h8z"/></svg>
        <div class="stripes"><i></i><i></i></div>
      </div>
      <div class="st">
        <p class="kicker" data-sc-cue="0 0.42 0" data-t="kicker"></p>
        <h1 class="pf h1" data-sc-cue="0 0.42 0" data-sc-kinetic="lines" data-t="h1"></h1>
        <p class="keep" data-sc-cue="0 0.42 0"><span data-rw="keep"></span></p>
      </div>
      <div class="st pick" id="pick" data-sc-cue="0.34 1 0.12 0.1">
        <h2 class="pf" data-t="whoT"></h2>
        <div class="types" id="types"></div>
        <p class="pickline" aria-live="polite"><span data-rw="pick"></span></p>
      </div>
    </div>
  </section>

  <!-- 2 RECOGNITION: flow. Their three pressures, in reading order. -->
  <section id="a2" class="a2" data-sc-act="flow">
    <div class="sc-wrap pains" data-sc-in data-sc-stagger="170">
      <p class="pf pain"><span data-rw="p0"></span></p>
      <p class="pf pain"><span data-rw="p1"></span></p>
      <p class="pf pain"><span data-rw="p2"></span></p>
    </div>
  </section>

  <!-- 3 BEING SEEN (peak): pin, the longest on the page. Their question wipes across in yellow. -->
  <section id="a3" data-sc-act="pin" data-sc-span="2.8" data-sc-drift="#0B0B0B">
    <div data-sc-stage>
      <div class="stripes stripes--a3" aria-hidden="true"><i></i><i></i></div>
      <div class="st">
        <p class="pf label" data-t="gapLabel"></p>
        <div class="gap" data-sc-reveal="left" data-sc-reveal-at="0.02 0.3">
          <p class="pf"><span data-rw="gap"></span></p>
        </div>
        <div class="pitch" data-sc-cue="0.34 1 0.14 0.06"><span data-rw="pitch"></span></div>
        <div class="next" data-sc-cue="0.5 1 0.14 0.08"><b data-t="nextT"></b><span data-rw="next"></span></div>
      </div>
    </div>
  </section>

  <!-- 4 TRUST: flow. The only act that reads like a document. -->
  <section id="a4" class="sc-section" data-sc-act="flow">
    <div class="sc-wrap a4">
      <div class="a4__vid" data-sc-in>
        <p class="pf vlabel" data-t="vlabel1"></p>
        <video controls playsinline preload="metadata" poster="video/peluang-poster.jpg">
          <source src="video/peluang-ms.mp4" type="video/mp4">
        </video>
        <p class="vnote" data-t="vnote"></p>
      </div>
      <div>
        <div class="block" id="what" data-sc-in data-sc-stagger="70"></div>
        <div class="block" id="why" data-sc-in data-sc-stagger="70"></div>
        <div class="block" id="faq" data-sc-in data-sc-stagger="50"></div>
      </div>
    </div>
  </section>

  <!-- 5 RESOLVE: pin, smallest type on the page, holds to the end. -->
  <section id="a5" data-sc-act="pin" data-sc-span="1.25" data-sc-drift="#141414">
    <div data-sc-stage>
      <div class="st">
        <div class="close" data-sc-cue="0 1 0 0">
          <p class="close__for"><b data-t="nextT"></b><span data-rw="next2"></span></p>
          <h2 class="pf close__q" data-t="pickTime"></h2>
          <p class="close__hint" data-t="slotHint"></p>
          <div class="slots">
            <a class="slot" data-slot="0" target="_blank" rel="noopener"><span data-rw="s0"></span></a>
            <a class="slot" data-slot="1" target="_blank" rel="noopener"><span data-rw="s1"></span></a>
          </div>
          <a class="close__other" id="other" target="_blank" rel="noopener" data-t="otherTime"></a>
        </div>
        <p class="close__soft" data-sc-cue="0.3"><span data-rw="soft"></span></p>
      </div>
      <footer class="foot">
        <p data-t="disc1"></p>
        <p data-t="disc2"></p>
        <p>#WEDOTRANSFORMATIONS · <a href="./" id="home" data-t="home"></a></p>
      </footer>
    </div>
  </section>
</main>

const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ms", L = T[lang];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa = text => `https://wa.me/${WA}?text=${encodeURIComponent(text)}`;
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
let cur = L.types.some(t => t.k === location.hash.slice(1)) ? location.hash.slice(1) : null;

// Static copy goes in before ScrollCraft.mount, so the kinetic h1 splits the right words.
document.documentElement.lang = lang;
document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
document.querySelectorAll("[data-t]").forEach(el => el.textContent = L[el.dataset.t]);
$("home").href = $("logo").href = lang === "en" ? "./?lang=en" : "./";
$("types").innerHTML = L.types.map(t => `<button type="button" data-k="${t.k}" aria-pressed="false">${esc(t.s)}</button>`).join('<span class="sep" aria-hidden="true">+</span>');
$("what").innerHTML = `<h2 class="pf h2">${esc(L.whatT)}</h2>` + L.what.map(x => `<p class="item">${esc(x)}</p>`).join("");
$("why").innerHTML = `<h2 class="pf h2">${esc(L.whyT)}</h2>` + L.why.map(([b, s]) => `<p class="item"><b>${esc(b)}</b><span>${esc(s)}</span></p>`).join("") + `<p class="pf motto">Help One. Transform One. Build One.</p>`;
$("faq").innerHTML = `<h2 class="pf h2">${esc(L.faqT)}</h2>` + L.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("") + `<p class="note">${esc(L.noGuarantee)}</p>`;

// The signature: write every [data-rw] line for the chosen type. Animated lines wipe out, swap, wipe back in.
function apply(animate){
  const t = L.types.find(x => x.k === (cur || "other"));
  const keep = cur ? t.keep + " " + L.keepTail : null;
  const v = { keep: keep || L.lede, pick: keep || L.pickHint, p0:t.pain[0], p1:t.pain[1], p2:t.pain[2],
              gap:t.gap, pitch:t.pitch, next:t.next, next2:t.next, s0:t.slots[0], s1:t.slots[1], soft:t.soft };
  let i = 0;
  document.querySelectorAll("[data-rw]").forEach(el => {
    const text = v[el.dataset.rw];
    el._t = text;
    if (el.textContent === text) return;
    if (!animate || reduce) { el.textContent = text; return; }
    setTimeout(() => {
      el.classList.add("rw-out");
      setTimeout(() => { el.textContent = el._t; el.classList.replace("rw-out", "rw-pre"); void el.offsetWidth; el.classList.remove("rw-pre"); }, 190);
    }, i++ * 45);
  });
  document.querySelectorAll("[data-slot]").forEach(a => a.href = wa(fill(L.waMsg, { type:t.t, next:t.next, slot:t.slots[a.dataset.slot] })));
  $("other").href = wa(fill(L.waOther, { type:t.t }));
  document.querySelectorAll("#types button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === cur));
  $("chip").hidden = !cur;
  $("chip-t").textContent = t.s.split(" /")[0];
}
apply(false);

// Scroll to the picker: two thirds into the first act, where the wall of words is fully up.
function goPick(){
  const a = $("a1");
  scrollTo({ top: a.offsetTop + (a.offsetHeight - innerHeight) * 0.66, behavior: reduce ? "auto" : "smooth" });
}
let goTimer;
$("types").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  cur = b.dataset.k;
  history.replaceState(null, "", "#" + cur);
  apply(true);
  if (e.detail) b.blur();   // mouse/touch: let the picker fade with the scroll; keyboard keeps focus
  clearTimeout(goTimer);    // let them watch the line under the wall rewrite, then move on
  goTimer = setTimeout(() => $("a2").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }), reduce ? 0 : 700);
});
$("chip").onclick = goPick;
$("pick").addEventListener("focusin", () => {
  const a = $("a1"), p = (scrollY - a.offsetTop) / (a.offsetHeight - innerHeight);
  if (p < 0.42 || p > 0.95) goPick();
});
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  if (b.dataset.lang === lang) return;
  const u = new URL(location.href);
  if (b.dataset.lang === "en") u.searchParams.set("lang", "en"); else u.searchParams.delete("lang");
  location.replace(u);   // reload so the kinetic h1 re-splits in the new language; the #type survives
});
</script>
