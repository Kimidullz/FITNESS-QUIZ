  $("why").innerHTML = L.why.map(([b, s]) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  $("what").innerHTML = L.what.map(x => `<li>${esc(x)}</li>`).join("");
  $("faq").innerHTML = L.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  $("types").innerHTML = L.types.map(t => `<button type="button" data-k="${t.k}" aria-pressed="${t.k === cur}">${esc(t.t)}</button>`).join("");
  $("types").querySelectorAll("button").forEach(b => b.onclick = () => { cur = b.dataset.k; render(); $("pitch").scrollIntoView({ behavior:"smooth", block:"start" }); });
  const t = L.types.find(x => x.k === cur);
  $("pitch").hidden = !t;
  if (!t) return;
  $("p-gap").textContent = t.gap; $("p-pitch").textContent = t.pitch; $("p-next").textContent = t.next; $("p-soft").textContent = t.soft;
  $("p-slots").innerHTML = t.slots.map(s => `<a class="btn" target="_blank" rel="noopener" href="${esc(wa(fill(L.waMsg, { type:t.t, next:t.next, slot:s })))}">${esc(s)}</a>`).join("");
  $("p-other").href = wa(fill(L.waOther, { type:t.t }));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; L = T[lang]; render();
  const u = new URL(location.href); if (lang === "en") u.searchParams.set("lang", "en"); else u.searchParams.delete("lang"); history.replaceState(null, "", u);
});
render();
</script>
</body>
</html>
